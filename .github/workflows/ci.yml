name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real MySQL server: the tests exercise MySQL's own constraints, window functions and regex,
    # which a mock or SQLite would not reproduce.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_password
      REQUIRE_MYSQL: "1"   # fail (do not skip) if the database is unreachable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests

      - name: Tests (unit + end-to-end + failure simulation)
        run: pytest -v

      - name: Demo run of the full pipeline
        run: python -m src.run_pipeline --reset --bookings 5000 --guests 1000
